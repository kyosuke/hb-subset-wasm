name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Emscripten SDK (pinned)
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install 6.0.13
          "$HOME/emsdk/emsdk" activate 6.0.13

      # pretest runs the full build (wasm + ts)
      - name: Build and test
        run: |
          source "$HOME/emsdk/emsdk_env.sh" > /dev/null
          npm test

      - name: Validate npm package
        run: npm pack --dry-run
